<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.name }} — MathPin 学习</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/math.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="{{ url_for('math.index') }}" class="nav-brand">📐 MathPin</a>
            <div class="nav-links">
                <a href="{{ url_for('math.book_detail', book_id=book.id) }}">← {{ book.name }}</a>
            </div>
        </div>
    </nav>

    <main class="container" style="max-width: 800px;">
        <div id="loadingScreen" style="text-align:center;padding:60px;">
            <p style="color:var(--text-secondary);">加载中...</p>
        </div>

        <!-- 题目展示 -->
        <div id="problemDisplay" style="display:none;">
            <div class="learn-problem" id="problemRenderer"></div>
        </div>

        <!-- 作答区 -->
        <div id="answerArea" style="display:none;">
            <div class="learn-answer-area">
                <label style="font-weight:600;display:block;margin-bottom:6px;">
                    写出完整解答（支持 LaTeX，$...$ 行内公式 / $$...$$ 块级公式）
                </label>
                <textarea id="userAnswer" placeholder="在此写出完整推导过程..."></textarea>
                <div style="display:flex;gap:8px;margin-top:8px;">
                    <button id="submitBtn" class="btn btn-primary" onclick="submitAnswer()">提交评判</button>
                    <button id="dontKnowBtn" class="btn btn-outline" onclick="dontKnow()">❌ 不会</button>
                </div>
            </div>
        </div>

        <!-- 评判结果 -->
        <div id="judgeArea" style="display:none;"></div>

        <!-- 追问讨论区 -->
        <div id="discussArea" style="display:none;">
            <div class="discuss-area">
                <div class="discuss-messages" id="discussMessages">
                    <div style="text-align:center;color:var(--text-secondary);padding:20px;">
                        对这道题有什么疑问？可以自由追问。
                    </div>
                </div>
                <div class="discuss-input-area">
                    <input type="text" id="discussInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')sendDiscuss()">
                    <button id="discussBtn" onclick="sendDiscuss()">发送</button>
                </div>
            </div>
            <div style="text-align:right;margin-top:12px;">
                <button class="btn btn-primary" onclick="nextProblem()">下一题 →</button>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/math/learn.js') }}"></script>
</body>
</html>
