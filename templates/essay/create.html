{% extends "base.html" %}
{% block title %}{{ '编辑' if essay else '上传' }}作文 - {{ book.name if book.name else book.title }}{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/essay.css') }}">
{% endblock %}

{% block content %}
<div class="essay-create-page">
    <a href="{{ url_for('essay.book_detail', book_id=book.id if book.id else book.essay_book_id) }}" class="back-link">← 返回作文本</a>
    <h1>{{ '✏️ 编辑作文' if essay else '✏️ 上传作文' }}</h1>

    <form id="essayForm" onsubmit="submitEssay(event)">
        <!-- 标题 -->
        <div class="form-group">
            <label for="title">标题 <span class="required">*</span></label>
            <input type="text" id="title" name="title" value="{{ essay.title if essay else '' }}"
                   placeholder="作文标题" required autofocus>
        </div>

        <!-- 作者 -->
        <div class="form-group">
            <label for="author">作者/来源</label>
            <input type="text" id="author" name="author" value="{{ essay.author if essay else '' }}"
                   placeholder="可选，如：名人姓名、出处">
        </div>

        <!-- 正文 -->
        <div class="form-group">
            <label for="content">正文 <span class="required">*</span></label>
            <textarea id="content" name="content" rows="18" required
                      placeholder="在此粘贴或输入作文内容...">{{ essay.content if essay else '' }}</textarea>
            <div class="form-hint">纯文本格式，换行会保留。推荐使用美观的段落排版。</div>
        </div>

        <!-- 摘要/笔记 -->
        <div class="form-group">
            <label for="summary">笔记/摘要</label>
            <textarea id="summary" name="summary" rows="3"
                      placeholder="可选：写下这篇作文的亮点或你的感想...">{{ essay.summary if essay else '' }}</textarea>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('essay.book_detail', book_id=book.id if book.id else book.essay_book_id) }}"
               class="btn btn-outline">取消</a>
            <button type="submit" class="btn btn-primary">
                {{ '保存修改' if essay else '上传作文' }}
            </button>
        </div>
    </form>
</div>

<script>
function submitEssay(e) {
    e.preventDefault();
    const isEdit = {{ 'true' if essay else 'false' }};
    const data = {
        {% if essay %}
        essay_id: {{ essay.id }},
        {% else %}
        book_id: {{ book.id }},
        {% endif %}
        title: document.getElementById('title').value.trim(),
        author: document.getElementById('author').value.trim(),
        content: document.getElementById('content').value.trim(),
        summary: document.getElementById('summary').value.trim(),
    };

    const endpoint = isEdit
        ? '{{ url_for("essay.api_update_essay") }}'
        : '{{ url_for("essay.api_create_essay") }}';

    fetch(endpoint, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
    })
    .then(r => r.json())
    .then(res => {
        if (res.success) {
            const bookId = res.book_id || {{ book.essay_book_id if essay else book.id }};
            location.href = '{{ url_for("essay.book_detail", book_id=0) }}'.replace('/0', '/' + bookId);
        } else {
            alert(res.message);
        }
    });
}
</script>
{% endblock %}
